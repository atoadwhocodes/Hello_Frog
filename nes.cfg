SYMBOLS {
    __STACKSIZE__: value = $0100, type = weak;
}

MEMORY {
    ZP:        file = "", start = $0000, size = $0100, type = rw, define = yes;
    RAM:       file = "", start = $0300, size = $0500, type = rw, define = yes;
    HEADER:    file = %O, start = $0000, size = $0010, fill = yes;
    PRG_PAD:   file = %O, start = $0000, size = $E000, fill = yes;
    PRG_FIXED: file = %O, start = $E000, size = $1FFA, fill = yes, define = yes;
    VECTORS:   file = %O, start = $FFFA, size = $0006, fill = yes;
    CHR:       file = %O, start = $0000, size = $8000, fill = yes;
}

SEGMENTS {
    HEADER:   load = HEADER,    type = ro;
    ZEROPAGE: load = ZP,        type = zp;
    BSS:      load = RAM,       type = bss, define = yes;
    STARTUP:  load = PRG_FIXED, type = ro,  define = yes;
    CODE:     load = PRG_FIXED, type = ro,  define = yes;
    RODATA:   load = PRG_FIXED, type = ro;
    DATA:     load = PRG_FIXED, run = RAM,  type = rw, define = yes;
    VECTORS:  load = VECTORS,   type = ro,  start = $FFFA;
    CHARS:    load = CHR,       type = ro;
}
